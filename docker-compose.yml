# docker-compose.yml — Hotel Intelligence Platform (HIP)
# Runs the FastAPI prediction API and Streamlit dashboard as separate services.
#
# Usage:
#   docker compose up --build          # start everything
#   docker compose up --build api      # start API only
#   docker compose logs -f dashboard   # tail dashboard logs
#   docker compose down                # stop and remove containers

version: "3.9"

services:

  # ── FastAPI Prediction API ───────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: hip_api
    ports:
      - "8000:8000"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount the model file at runtime so it can be swapped without rebuild
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  # ── Streamlit Dashboard ──────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: hip_dashboard
    ports:
      - "8501:8501"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      # Optional: pass your Gemini API key for the AI Analyst feature
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
    volumes:
      - ./models:/app/models:ro
      - ./data/processed:/app/data/processed:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped
